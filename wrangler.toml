# FSB Appraisal Desk on Cloudflare Workers
name = "fsb-appraisal-desk"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

# Production hostname. Cloudflare creates the DNS record and certificate on deploy.
routes = [
  { pattern = "fsb.apprifi.com", custom_domain = true }
]

# The app files. Unknown paths fall back to index.html so hash links always land.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/f/*", "/brand/*"]

[vars]
PUBLIC_URL = "https://fsb.apprifi.com"
LENDER_NAME = "First Security Bank"
LENDER_SHORT = "FSB"
LENDER_TAGLINE = "Mackinaw, Heritage Lake, Deer Creek, Danvers"
TIMEZONE = "America/Chicago"
VENDOR_EMAIL = "crescicharles@gmail.com"
MAIL_FROM = "First Security Bank via Apprifi <no-reply@apprifi.com>"
# MAIL_REPLY_TO = "someone@fsb1.com"
MAIL_INBOUND = "desk@apprifi.com"   # Email Routing sends desk@apprifi.com (subaddressing on) to this Worker

# Orders, people, audit log, message queue. Create with: npx wrangler d1 create fsb-portal
[[d1_databases]]
binding = "DB"
database_name = "fsb-portal"
database_id = "6b6807bb-e4e0-4f1c-9f97-9cc98abb1262"
migrations_dir = "migrations"

# Document bytes. Create with: npx wrangler kv namespace create FILES
[[kv_namespaces]]
binding = "FILES"
id = "85874fed1930410eb70ea081b9278011"

# Optional larger document store (needs R2 enabled on the account). Uncomment to switch new uploads to R2;
# earlier files stay readable from KV because each document records where it lives.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fsb-portal-docs"

# Automatic email through Cloudflare Email Service (Workers Paid plan). After onboarding apprifi.com under
# Compute > Email Service > Email Sending, uncomment these two lines and redeploy. Alternative: the
# RESEND_API_KEY secret. Either way the portal sends branded HTML mail with plain-text fallback.
[[send_email]]
name = "EMAIL"

# Retries queued email every five minutes and prunes expired sessions.
[triggers]
crons = ["*/5 * * * *"]

# Secrets (never in this file): npx wrangler secret put AUTH_SECRET
# Optional: RESEND_API_KEY (if not using Cloudflare Email Service); TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN and
# either TWILIO_MESSAGING_SERVICE_SID or TWILIO_FROM for texts. Twilio webhooks: /api/hooks/twilio/inbound
# (incoming messages) and /api/hooks/twilio/status (delivery reports), both signature-checked.

# ---------------------------------------------------------------------------
# Demonstration copies: same code, one shared demonstration database and store, sample people and
# orders, nothing sent, reset nightly. Two hostnames read the same data under different lender names:
#   demo.apprifi.com     "Prairie Community Bank" (fictional), linked from the public site
#   fsbdemo.apprifi.com  the copy shown to First Security Bank
# Deploy with: npx wrangler deploy --env demo   and   npx wrangler deploy --env fsbdemo
[env.demo]
name = "apprifi-demo"
workers_dev = false
routes = [
  { pattern = "demo.apprifi.com", custom_domain = true }
]

[env.demo.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/f/*", "/brand/*"]

[env.demo.vars]
PUBLIC_URL = "https://demo.apprifi.com"
LENDER_NAME = "Prairie Community Bank"
LENDER_SHORT = "PCB"
LENDER_TAGLINE = "Pontiac, Fairbury and Chenoa"
TIMEZONE = "America/Chicago"
DEMO = "1"
PBKDF2_ITER = "1000"

[[env.demo.d1_databases]]
binding = "DB"
database_name = "fsb-portal-demo"
database_id = "a438ae7f-9794-418f-b2b6-baab86b168ab"
migrations_dir = "migrations"

[[env.demo.kv_namespaces]]
binding = "FILES"
id = "1702a8c6c5f84468928894317b427623"

[env.demo.triggers]
crons = ["0 8 * * *"]

[env.fsbdemo]
name = "fsb-appraisal-desk-demo"
workers_dev = false
routes = [
  { pattern = "fsbdemo.apprifi.com", custom_domain = true }
]

[env.fsbdemo.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/f/*", "/brand/*"]

[env.fsbdemo.vars]
PUBLIC_URL = "https://fsbdemo.apprifi.com"
LENDER_NAME = "First Security Bank"
LENDER_SHORT = "FSB"
LENDER_TAGLINE = "Mackinaw, Heritage Lake, Deer Creek, Danvers"
TIMEZONE = "America/Chicago"
DEMO = "1"
PBKDF2_ITER = "1000"

[[env.fsbdemo.d1_databases]]
binding = "DB"
database_name = "fsb-portal-demo"
database_id = "a438ae7f-9794-418f-b2b6-baab86b168ab"
migrations_dir = "migrations"

[[env.fsbdemo.kv_namespaces]]
binding = "FILES"
id = "1702a8c6c5f84468928894317b427623"

[env.fsbdemo.triggers]
crons = []   # the demo env's nightly reset covers the shared database
